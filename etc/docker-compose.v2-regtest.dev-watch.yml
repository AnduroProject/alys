# Development Mode with Hot-Reload (cargo-watch)
# Auto-rebuilds and restarts when code changes
#
# Usage:
#   docker compose -f docker-compose.dev-watch.yml up
#
# Features:
# - Automatic rebuild on file changes (cargo-watch)
# - Source code mounted as volume
# - Cargo cache mounted (reuse local cargo cache)
# - Live logs visible

version: "3.8"

networks:
  alys-regtest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  # Bitcoin Core (unchanged)
  bitcoin-core:
    image: balajimara/bitcoin:25.99
    container_name: bitcoin-core
    restart: unless-stopped
    networks:
      alys-regtest:
        ipv4_address: 172.20.0.20
    ports:
      - "18443:18443"
      - "18333:18333"
    volumes:
      - ../data/bitcoin:/root/.bitcoin
    command: >
      ./src/bitcoind
      -printtoconsole
      -regtest
      -txindex=1
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0:18443
      -rpcuser=rpcuser
      -rpcpassword=rpcpassword
      -fallbackfee=0.00001

  # Reth Execution Layer (unchanged)
  execution:
    image: ghcr.io/paradigmxyz/reth:v1.1.3
    container_name: execution
    restart: unless-stopped
    networks:
      alys-regtest:
        ipv4_address: 172.20.0.30
    ports:
      - "8456:8456"
      - "8545:8545"
      - "8551:8551"
      - "19001:19001"
      - "30303:30303"
    volumes:
      - ../execution/config/genesis/custom_genesis.json:/opt/alys/execution/config/genesis/custom_genesis.json:ro
      - ../execution/config/jwt/jwt.hex:/opt/alys/execution/config/jwt/jwt.hex:ro
      - ../data/execution:/root/.local/share/reth/dev
    command: >
      node
      --dev
      --dev.block-time 3s
      --chain /opt/alys/execution/config/genesis/custom_genesis.json
      --datadir /root/.local/share/reth/dev
      --metrics 0.0.0.0:19001
      --authrpc.addr 0.0.0.0
      --authrpc.port 8551
      --authrpc.jwtsecret /opt/alys/execution/config/jwt/jwt.hex
      --http --http.addr 0.0.0.0 --http.port 8545
      --http.api "debug,net,eth,web3,txpool"
      --http.corsdomain "*"
      --ws.api "eth,net,web3,debug,txpool"
      --ws
      --ws.addr 0.0.0.0
      --ws.port 8456
      --ws.origins "*"
      --port 30303

  # Alys Node 1 - Hot-Reload Mode
  alys-node-1-watch:
    image: rust:bullseye
    container_name: alys-node-1-watch
    networks:
      alys-regtest:
        ipv4_address: 172.20.0.10
    ports:
      - "3000:3000"
      - "3001:3001"
      - "9000:9000"
      - "9090:9090"
      - "10000:10000"
    volumes:
      - ..:/opt/alys:cached
      - ~/.cargo/registry:/usr/local/cargo/registry:cached
      - ~/.cargo/git:/usr/local/cargo/git:cached
      - ../data/node1:/lib/alys/data
      - ./config/jwt/jwt.hex:/lib/alys/jwt.hex:ro
    working_dir: /opt/alys
    environment:
      - RUST_LOG=info,app=debug
      - RUST_BACKTRACE=1
    command: >
      bash -c "
      set -e
      echo '🔧 Installing system dependencies...'
      apt-get update && apt-get install -y cmake ninja-build clang libclang-dev llvm-dev git ca-certificates > /dev/null 2>&1

      echo '📦 Installing cargo-watch...'
      cargo install cargo-watch

      echo '👀 Starting cargo-watch (hot-reload mode)...'
      echo '   Changes to .rs files will trigger automatic rebuild'
      echo ''
      cargo watch -x 'run --bin app -- \
        --dev-regtest \
        --regtest-node-id 1 \
        --rpc-port 3000 \
        --p2p-port 9000 \
        --p2p-listen-addr 0.0.0.0 \
        --db-path /lib/alys/data/db \
        --wallet-path /lib/alys/data/wallet \
        --geth-url http://execution:8551 \
        --geth-execution-url http://execution:8545 \
        --bitcoin-rpc-url http://bitcoin-core:18443 \
        --bitcoin-rpc-user rpcuser \
        --bitcoin-rpc-pass rpcpassword \
        --jwt-secret /lib/alys/jwt.hex \
        --metrics-port 9090'
      "
    depends_on:
      - execution
      - bitcoin-core

  # Alys Node 2 - Hot-Reload Mode
  alys-node-2-watch:
    image: rust:bullseye
    container_name: alys-node-2-watch
    networks:
      alys-regtest:
        ipv4_address: 172.20.0.11
    ports:
      - "3010:3000"
      - "3011:3001"
      - "9001:9000"
      - "9091:9090"
      - "10001:10000"
    volumes:
      - ..:/opt/alys:cached
      - ~/.cargo/registry:/usr/local/cargo/registry:cached
      - ~/.cargo/git:/usr/local/cargo/git:cached
      - ../data/node2:/lib/alys/data
      - ../execution/config/jwt/jwt.hex:/lib/alys/jwt.hex:ro
    working_dir: /opt/alys
    environment:
      - RUST_LOG=info,app=debug
      - RUST_BACKTRACE=1
    command: >
      bash -c "
      set -e
      echo '🔧 Installing system dependencies...'
      apt-get update && apt-get install -y cmake ninja-build clang libclang-dev llvm-dev git ca-certificates > /dev/null 2>&1

      echo '📦 Installing cargo-watch...'
      cargo install cargo-watch

      echo '👀 Starting cargo-watch (hot-reload mode)...'
      echo '   Changes to .rs files will trigger automatic rebuild'
      echo ''
      cargo watch -x 'run --bin app -- \
        --dev-regtest \
        --regtest-node-id 2 \
        --rpc-port 3000 \
        --p2p-port 9000 \
        --p2p-listen-addr 0.0.0.0 \
        --db-path /lib/alys/data/db \
        --wallet-path /lib/alys/data/wallet \
        --geth-url http://execution:8551 \
        --geth-execution-url http://execution:8545 \
        --bitcoin-rpc-url http://bitcoin-core:18443 \
        --bitcoin-rpc-user rpcuser \
        --bitcoin-rpc-pass rpcpassword \
        --jwt-secret /lib/alys/jwt.hex \
        --metrics-port 9090'
      "
    depends_on:
      - execution
      - bitcoin-core
