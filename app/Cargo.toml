[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]

# lighthouse
#execution_layer = { git = "https://github.com/sigp/lighthouse", branch = "stable" }
#sensitive_url = { git = "https://github.com/sigp/lighthouse", branch = "stable" }
#types = { git = "https://github.com/sigp/lighthouse", branch = "stable" }
#store = { git = "https://github.com/sigp/lighthouse", branch = "stable" }
#bls = { git = "https://github.com/sigp/lighthouse", branch = "stable" }
#execution_layer = { git = "https://github.com/sigp/lighthouse", rev = "441fc16" }
#sensitive_url = { git = "https://github.com/sigp/lighthouse", rev = "441fc16" }
#types = { git = "https://github.com/sigp/lighthouse", rev = "441fc16" }
#store = { git = "https://github.com/sigp/lighthouse", rev = "441fc16" }
#bls = { git = "https://github.com/sigp/lighthouse", rev = "441fc16" }

lighthouse_wrapper = { package = "lighthouse_wrapper", path = "../crates/lighthouse_wrapper" }



# workspace
bridge = { package = "federation", path = "../crates/federation" }

# misc
clap = { workspace = true }
eyre = { workspace = true }
anyhow = "1.0"  # V2 NetworkActor error handling (replaces actor_system)
humantime = "2.1"  # V2 NetworkActor RPC timestamp formatting
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-futures = "0.2"
strum = { version = "0.26", features = ["derive"] }
thiserror = { workspace = true }
slog = { version = "2", features = ["max_level_trace", "release_max_level_trace"] }
snap = "1"
smallvec = "1"
unsigned-varint = { version = "0.6", features = ["codec"] }
ssz_types = "0.5"
regex = "1"
fnv = "1"
rand = "0.8.5"
once_cell = "1.19.0"
prometheus = { workspace = true }
lazy_static = { workspace = true }
svix-ksuid = "0.8.0"

# async
futures = { workspace = true }
futures-timer = "3.0.1"
tokio = { workspace = true, features = ["time"] }
tokio-util = { version = "0.6", features = ["codec", "compat", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }  # V2 NetworkActor: Actix-Tokio event bridge
tokio-io-timeout = "1"
async-trait = "0.1"

# storage (V2 uses RocksDB only)
rocksdb = "0.21"
actix = "0.13"
uuid = { version = "1.0", features = ["v4", "serde"] }
lru = "0.12"

# Testing infrastructure
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
mockall = "0.11"
wiremock = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
chrono = "0.4"
tempfile = "3.8"

# encoding
ethereum_ssz = { version = "0.5", features = ["arbitrary"] }
ethereum_ssz_derive = "0.5"
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = "1.0.94"
rmp-serde = "1.1.2"
bincode = "1.3"
crc32fast = "1.3"
tiny-keccak = { version = "2.0", features = ["keccak"] }

# crypto (for keygen utility)
blake2 = "0.10"

# ethereum
superstruct = "0.6"
tree_hash = "0.5"
tree_hash_derive = "0.5"
ethereum-types = { workspace = true }
ethers-core = { workspace = true }
ethers = { workspace = true }

# bitcoin
bitcoin = { workspace = true, features = ["serde"] }

# networking
hyper = { version = "0.14", features = ["full"] }
rust_decimal = { version = "1.37.1", features = ["macros"] }

[dependencies.libp2p]
version = "0.52"
default-features = false
# V2 NetworkActor simplified features + V1 compatibility
# V2 uses: identify, yamux, noise, gossipsub, tcp, request-response
# V1 needs: mdns, quic (temporarily included for compatibility)
features = ["identify", "yamux", "mdns", "noise", "gossipsub", "dns", "tcp", "tokio", "plaintext", "secp256k1", "macros", "ecdsa", "quic", "request-response"]

[dev-dependencies]

# Additional testing tools
test-case = "3.3"
rstest = "0.18"
serial_test = "3.0"
tokio-test = "0.4"
env_logger = "0.10"

[[example]]
name = "storage_demo"
path = "../examples/storage_demo.rs"

[[example]]
name = "network_v2_validation"
path = "../examples/network_v2_validation.rs"

[[example]]
name = "network_v2_simple_test"
path = "../examples/network_v2_simple_test.rs"

[[example]]
name = "network_v2_production_demo"
path = "../examples/network_v2_production_demo.rs"

[[example]]
name = "network_v2_mdns_demo"
path = "../examples/network_v2_mdns_demo.rs"

[[example]]
name = "network_debug_creation"
path = "../examples/network_debug_creation.rs"

# Binaries
[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "app"
path = "src/main.rs"
