name: V2 Storage Actor Testing

on:
  push:
    branches: [ main, feature/v2-storage ]
    paths:
      - 'app/src/actors_v2/storage/**'
      - 'app/src/actors_v2/testing/**'
      - 'app/Cargo.toml'
      - '.github/workflows/v2-storage-testing.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/actors_v2/storage/**'
      - 'app/src/actors_v2/testing/**'
      - 'app/Cargo.toml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Quick validation checks
  validate:
    name: Validate V2 Storage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check code formatting
      run: cd app && cargo fmt --all -- --check

    - name: Run clippy
      run: cd app && cargo clippy --all-features -- -D warnings

    - name: Validate dependencies
      run: cd app && cargo check --all-features

  # Unit tests (60% of test coverage)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      matrix:
        test-suite:
          - database_tests
          - cache_tests
          - message_tests
          - metrics_tests

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run unit tests
      run: |
        cd app
        cargo test --lib actors_v2::testing::storage::unit::${{ matrix.test-suite }} -- --nocapture
      env:
        RUST_LOG: debug
        TOKIO_WORKER_THREADS: 4

  # Integration tests (25% of test coverage)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      matrix:
        test-suite:
          - actor_tests
          - persistence_tests
          - concurrency_tests

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Create test data directory
      run: mkdir -p /tmp/alys-v2-test-data

    - name: Run integration tests
      run: |
        cd app
        cargo test --lib actors_v2::testing::storage::integration::${{ matrix.test-suite }} -- --nocapture --test-threads=1
      env:
        RUST_LOG: debug
        TOKIO_WORKER_THREADS: 4
        ALYS_V2_TEST_DATA_DIR: /tmp/alys-v2-test-data

    - name: Cleanup test data
      if: always()
      run: rm -rf /tmp/alys-v2-test-data

  # Property-based tests (10% of test coverage)
  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run property-based tests
      run: |
        cd app
        cargo test --lib actors_v2::testing::storage::property -- --nocapture
      env:
        RUST_LOG: info
        PROPTEST_CASES: 1000
        PROPTEST_MAX_SHRINK_ITERS: 10000
        TOKIO_WORKER_THREADS: 4

    - name: Generate property test report
      if: always()
      run: |
        echo "Property test execution completed"
        echo "Cases run: ${PROPTEST_CASES:-1000}"
        echo "Max shrink iterations: ${PROPTEST_MAX_SHRINK_ITERS:-10000}"

  # Chaos tests (5% of test coverage) - Only on main branch or explicit trigger
  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, property-tests]
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'chaos-test')

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies for chaos testing
      run: |
        sudo apt-get update
        sudo apt-get install -y stress-ng protobuf-compiler

    - name: Run chaos tests
      run: |
        cd app
        timeout 300s cargo test --lib actors_v2::testing::storage::chaos -- --nocapture --test-threads=1
      env:
        RUST_LOG: info
        TOKIO_WORKER_THREADS: 8
        CHAOS_TEST_DURATION: 60
        CHAOS_FAILURE_RATE: 0.15

    - name: Generate chaos test report
      if: always()
      run: |
        echo "Chaos test execution completed"
        echo "Test duration: ${CHAOS_TEST_DURATION:-60} seconds"
        echo "Failure injection rate: ${CHAOS_FAILURE_RATE:-0.15}"

  # Performance benchmarks - Only on main branch
  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run performance benchmarks
      run: |
        cd app
        cargo bench --bench storage_actor_benchmarks
      env:
        RUST_LOG: warn

    - name: Archive benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: target/criterion/

  # Coverage reporting
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, property-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Generate coverage report
      run: |
        cd app
        cargo llvm-cov --lib --workspace --lcov --output-path lcov.info \
          --ignore-filename-regex="(testing|test)" \
          -- actors_v2::storage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./app/lcov.info
        flags: v2-storage-actor
        name: v2-storage-coverage
        fail_ci_if_error: false

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cd app && cargo audit

    - name: Check for vulnerable dependencies
      run: cd app && cargo audit --deny warnings

  # Final validation and reporting
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, integration-tests, property-tests, coverage, security-audit]
    if: always()

    steps:
    - name: Report test results
      run: |
        echo "# V2 Storage Actor Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results:" >> $GITHUB_STEP_SUMMARY
        echo "- **Validation**: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Property Tests**: ${{ needs.property-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Coverage**: ${{ needs.coverage.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Security Audit**: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ needs.chaos-tests.result }}" != "skipped" ]]; then
          echo "- **Chaos Tests**: ${{ needs.chaos-tests.result }}" >> $GITHUB_STEP_SUMMARY
        fi

        if [[ "${{ needs.performance-tests.result }}" != "skipped" ]]; then
          echo "- **Performance Tests**: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Coverage Distribution:" >> $GITHUB_STEP_SUMMARY
        echo "- Unit Tests: 60%" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Tests: 25%" >> $GITHUB_STEP_SUMMARY
        echo "- Property Tests: 10%" >> $GITHUB_STEP_SUMMARY
        echo "- Chaos Tests: 5%" >> $GITHUB_STEP_SUMMARY

    - name: Check overall status
      run: |
        if [[ "${{ needs.validate.result }}" != "success" ]] || \
           [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
           [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
           [[ "${{ needs.property-tests.result }}" != "success" ]] || \
           [[ "${{ needs.security-audit.result }}" != "success" ]]; then
          echo "❌ Some required tests failed"
          exit 1
        else
          echo "✅ All required tests passed"
        fi