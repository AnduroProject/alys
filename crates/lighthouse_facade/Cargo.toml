[package]
name = "lighthouse_facade"
version = "0.1.0"
edition = "2021"
authors = ["Alys Development Team"]
description = "Unified facade interface for Lighthouse v4 and v7 integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnduroProject/alys"
documentation = "https://docs.rs/lighthouse_facade"

[features]
default = ["metrics"]
# Production Lighthouse features
v4 = []  # V4 temporarily disabled due to dependency conflicts - uses mock implementations
v7 = ["lighthouse_v7_execution_layer", "lighthouse_v7_types", "lighthouse_v7_store", "lighthouse_v7_bls"]
migration = ["v4", "v7", "ab-testing"]  # Full migration support (v4 mocked, v7 real)
ab-testing = ["rand", "siphasher"]
metrics = ["prometheus", "tokio-metrics"]
testing = ["proptest", "mockall"]

[dependencies]
# Workspace dependencies
actix = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Direct Lighthouse dependencies (now managed internally by facade)
# Real Lighthouse dependencies (temporarily disabled due to dependency conflicts)
# When enabled, these provide production-ready Lighthouse integration
# 
# V4 dependencies (current)
# lighthouse_v4_execution_layer = { git = "https://github.com/sigp/lighthouse", rev = "441fc16", optional = true, package = "execution_layer" }
# lighthouse_v4_types = { git = "https://github.com/sigp/lighthouse", rev = "441fc16", optional = true, package = "types" }
# lighthouse_v4_store = { git = "https://github.com/sigp/lighthouse", rev = "441fc16", optional = true, package = "store" }
# lighthouse_v4_bls = { git = "https://github.com/sigp/lighthouse", rev = "441fc16", optional = true, package = "bls" }
#
# V7 dependencies (target) - enabled for production
lighthouse_v7_execution_layer = { git = "https://github.com/sigp/lighthouse", tag = "v7.1.0", optional = true, package = "execution_layer" }
lighthouse_v7_types = { git = "https://github.com/sigp/lighthouse", tag = "v7.1.0", optional = true, package = "types" }
lighthouse_v7_store = { git = "https://github.com/sigp/lighthouse", tag = "v7.1.0", optional = true, package = "store" }
lighthouse_v7_bls = { git = "https://github.com/sigp/lighthouse", tag = "v7.1.0", optional = true, package = "bls" }

# Ethereum types
ethereum-types = { workspace = true }

# Error handling
anyhow = "1.0"
eyre = { workspace = true }

# Utilities
num_cpus = "1.16"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Ethereum types and SSZ
ssz_types = "0.5"
tree_hash = "0.5"
tree_hash_derive = "0.5"

# Networking and HTTP
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
hyper = { version = "0.14", features = ["full"] }

# Serialization
rmp-serde = "1.1"
bincode = "1.3"

# Crypto
sha2 = { version = "0.10", features = ["asm"] }

# Migration and A/B testing
rand = { version = "0.8", optional = true }
siphasher = { version = "0.3", optional = true }

# Metrics
prometheus = { workspace = true, optional = true }
tokio-metrics = { version = "0.3", optional = true }

# Testing
proptest = { version = "1.4", optional = true }
mockall = { version = "0.12", optional = true }

# Configuration
config = "0.14"
toml = { workspace = true }

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
arc-swap = "1.6"
hex = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
test-log = "0.2"
env_logger = "0.10"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]